<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET VIP KEY // FREE FIRE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align: center; padding: 30px;">
        <h2 style="color: var(--hacker-green); margin-bottom: 20px;">HỆ THỐNG CẤP KEY VIP</h2>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Cảm ơn bạn đã vượt link thành công! Bấm nút bên dưới để hiển thị Key VIP của bạn (Key dùng 1 lần duy nhất).</p>
        
        <button id="getKeyBtn" class="btn-main" onclick="generateAndDisplayKey()">HIỂN THỊ KEY VIP</button>

        <div id="keyResultBox" style="display: none; margin-top: 25px;">
            <div style="font-size: 12px; color: var(--hacker-green); margin-bottom: 8px;">KEY VIP CỦA BẠN:</div>
            <input type="text" id="generatedKey" class="form-control" readonly style="text-align: center; font-size: 18px; font-weight: bold; color: var(--hacker-green); margin-bottom: 12px;">
            <button class="btn-main" style="background: #333; color: #fff; margin-bottom: 10px;" onclick="copyKey()">COPY KEY</button>
            <br>
            <button class="btn-main" onclick="window.location.href='index.html'">ĐÃ XONG QUAY TRỞ LẠI</button>
        </div>
    </div>

    <!-- Gọi file JS riêng cho trang Get Key -->
    <script src="get-key.js"></script>
</body>
</html>
